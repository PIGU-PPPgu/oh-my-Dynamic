name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify install assets
        run: |
          bash -n install_plugin.sh
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          test -f LICENSE
      - name: Install dev package
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m py_compile *.py examples/*.py scripts/*.py $(find src -name '*.py' -print)
      - name: Test
        run: python test_suite.py
      - name: Pytest smoke
        run: python -m pytest tests -q
      - name: Coverage
        run: |
          python -m coverage run -m pytest tests -q
          python -m coverage report --fail-under=80
      - name: Security scan
        run: python -m bandit -r . -c pyproject.toml
      - name: CLI help
        run: |
          python -m codex_cli_swarm --help >/dev/null
          python -m codex_swarm_cli --help >/dev/null
          python -m dynamic_workflow --help >/dev/null
          PYTHONPATH=src python -m oh_my_dynamic.runtime.dynamic_workflow --help >/dev/null
          PYTHONPATH=src python -m oh_my_dynamic.codex.codex_cli_swarm --help >/dev/null
          python scripts/record_swarm_evidence.py --help >/dev/null
          python scripts/record_adaptive_workflow_evidence.py --help >/dev/null
          python scripts/render_workflow_observability.py --help >/dev/null
          python scripts/run_quality_eval.py --help >/dev/null
          python scripts/run_benchmark.py --help >/dev/null
          python examples/codex_cli_swarm_review.py --help >/dev/null
          python examples/real_repo_review.py --help >/dev/null
          python -m doctor --json >/dev/null
      - name: Package install smoke
        run: |
          tmpdir="$(mktemp -d)"
          python -m pip install . --target "$tmpdir"
          (
            cd /tmp
            PYTHONPATH="$tmpdir" python -c "from oh_my_dynamic.runtime.dynamic_workflow import DynamicWorkflowRuntime; from oh_my_dynamic.codex.codex_cli_swarm import CodexCliSwarmRuntime; from oh_my_dynamic.broker.agent_broker import AgentBroker; print(DynamicWorkflowRuntime.__name__, CodexCliSwarmRuntime.__name__, AgentBroker.__name__)"
          )
      - name: Quality eval smoke
        run: python scripts/run_quality_eval.py --sample --output /tmp/quality_eval.md
      - name: Benchmark dry-run smoke
        run: python scripts/run_benchmark.py --suite benchmarks/repo_review.json --mode single,fixed,adaptive --output /tmp/benchmark_v320.json
      - name: Safe example smoke
        run: |
          python examples/real_repo_review.py --dry-run --run-id ci-dry --output-dir /tmp/ohmy-evidence
          python scripts/record_adaptive_workflow_evidence.py --required-coverage security,tests,docs,replanner-proof --force-missing-coverage replanner-proof --max-rounds 2 --max-agents 12 --max-parallel 4 --dry-run --output-dir /tmp/ohmy-adaptive
          python examples/research_analysis.py >/tmp/ohmy-research-demo.txt
          python examples/code_review.py >/tmp/ohmy-code-review-demo.txt
      - name: Evidence redaction scan
        run: |
          ! grep -R "/Users/" docs/evidence
