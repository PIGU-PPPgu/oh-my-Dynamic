[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-dynamic"
version = "1.1.0"
description = "Multi-agent orchestration engine with DAG execution, dynamic replan, TEA protocol, and model-provider routing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PIGU-PPPgu" }]
dependencies = [
  "openai>=1.0.0",
]

[project.optional-dependencies]
zhipu = ["zhipuai>=2.0.0"]
anthropic = ["anthropic>=0.40.0"]
google = ["google-generativeai>=0.8.0"]
all = [
  "zhipuai>=2.0.0",
  "anthropic>=0.40.0",
  "google-generativeai>=0.8.0",
]
dev = [
  "bandit>=1.7.10",
]

[tool.setuptools]
py-modules = [
  "agents",
  "dag",
  "dynamic_replan",
  "llm_client",
  "message_bus",
  "native_runtime",
  "orchestrator",
  "pipeline",
  "protocol_adapters",
  "prompt_kit",
  "stop_conditions",
  "synthesis",
  "task",
  "tea_protocol",
  "team_engine",
  "token_tracker",
  "validator",
  "visualize",
  "worktree",
]

[tool.bandit]
exclude_dirs = [".git", "__pycache__", ".venv", "venv"]
