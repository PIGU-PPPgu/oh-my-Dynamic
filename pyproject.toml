[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-dynamic"
version = "1.9.0"
description = "Multi-agent orchestration engine with DAG execution, dynamic replan, TEA protocol, and model-provider routing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PIGU-PPPgu" }]
dependencies = [
  "openai>=1.0.0",
]

[project.optional-dependencies]
zhipu = ["zhipuai>=2.0.0"]
anthropic = ["anthropic>=0.40.0"]
google = ["google-generativeai>=0.8.0"]
all = [
  "zhipuai>=2.0.0",
  "anthropic>=0.40.0",
  "google-generativeai>=0.8.0",
]
dev = [
  "bandit>=1.7.10",
  "coverage[toml]>=7.4.0",
]

[project.scripts]
oh-my-dynamic-gateway = "broker_gateway:main"
oh-my-dynamic-codex-swarm = "codex_cli_swarm:main"
oh-my-dynamic-dynamic-workflow = "dynamic_workflow:main"

[tool.setuptools]
py-modules = [
  "agent_broker",
  "broker_gateway",
  "broker_reducer",
  "capability_registry",
  "checkpoint",
  "codex_cli_swarm",
  "codex_swarm_artifacts",
  "codex_swarm_cli",
  "codex_swarm_models",
  "codex_swarm_process",
  "codex_swarm_scheduler",
  "codex_worker",
  "codex_app_bridge",
  "agents",
  "dag",
  "dynamic_workflow",
  "dynamic_replan",
  "llm_client",
  "message_bus",
  "native_runtime",
  "orchestrator",
  "pipeline",
  "protocol_adapters",
  "prompt_kit",
  "stop_conditions",
  "synthesis",
  "task",
  "tea_protocol",
  "team_engine",
  "token_tracker",
  "validator",
  "visualize",
  "workflow_events",
  "workflow_config",
  "workflow_observer",
  "worktree",
]

[tool.bandit]
exclude_dirs = [".git", "__pycache__", ".venv", "venv"]

[tool.coverage.run]
source = ["."]
omit = [
  ".codegraph/*",
  ".orchestry/*",
  ".venv/*",
  "venv/*",
  "build/*",
  "dist/*",
  "*dashboard.html",
  "agents.py",
  "demo.py",
  "message_bus.py",
  "orchestrator.py",
  "team_engine.py",
  "validator.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
