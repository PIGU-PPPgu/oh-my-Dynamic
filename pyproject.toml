[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-dynamic"
version = "3.3.0"
description = "Multi-agent orchestration engine with DAG execution, dynamic replan, TEA protocol, and model-provider routing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PIGU-PPPgu" }]
dependencies = [
  "openai>=1.0.0",
]

[project.optional-dependencies]
zhipu = ["zhipuai>=2.0.0"]
anthropic = ["anthropic>=0.40.0"]
google = ["google-generativeai>=0.8.0"]
all = [
  "zhipuai>=2.0.0",
  "anthropic>=0.40.0",
  "google-generativeai>=0.8.0",
]
dev = [
  "bandit>=1.7.10",
  "coverage[toml]>=7.4.0",
  "pytest>=8.0.0",
]

[project.scripts]
oh-my-dynamic-gateway = "oh_my_dynamic.cli.gateway:main"
oh-my-dynamic-codex-swarm = "oh_my_dynamic.cli.codex_swarm:main"
oh-my-dynamic-dynamic-workflow = "oh_my_dynamic.cli.dynamic_workflow:main"
oh-my-dynamic-quality-eval = "oh_my_dynamic.cli.quality_eval:main"
oh-my-dynamic-doctor = "oh_my_dynamic.cli.doctor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["oh_my_dynamic*"]

[tool.bandit]
exclude_dirs = [".git", ".codegraph", ".orchestry", "__pycache__", ".venv", "venv", "tests", "test_suite.py", "docs/evidence"]
skips = ["B101", "B110", "B404", "B603", "B607"]

[tool.coverage.run]
source = ["src/oh_my_dynamic"]
omit = [
  ".codegraph/*",
  ".orchestry/*",
  ".venv/*",
  "venv/*",
  "build/*",
  "dist/*",
  "*dashboard.html",
  "agents.py",
  "demo.py",
  "message_bus.py",
  "orchestrator.py",
  "team_engine.py",
  "validator.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
